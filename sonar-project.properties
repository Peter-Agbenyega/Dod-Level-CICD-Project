# SonarCloud configuration for the secure DevSecOps pipeline reference application
sonar.projectKey=dod-ops-dashboard
sonar.organization=peter-agbenyega
sonar.projectName=Secure DevSecOps Pipeline Reference Architecture

# Source paths
sonar.sources=server,client/src
sonar.tests=server/__tests__
sonar.test.inclusions=**/*.test.js

# Exclusions
sonar.exclusions=**/node_modules/**,client/build/**,coverage/**,**/*.test.js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8
